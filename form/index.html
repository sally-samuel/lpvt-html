<div data-site-component="header"></div>
<main>

<header class="page-hero" style="background-image:url('../images/faqs_bg.jpg')"><div class="container"><h1>Let’s power your next solar project with precision!</h1></div></header>
<section class="section">
  <div class="container" style="max-width:760px">
    <p class="lead-text text-center mb-4">Complete the form below to speak with our team about your project needs, recommendations, solar panel prices, and delivery timelines.</p>
    <form class="form-card needs-validation" data-emailjs data-subject="Partner / quote request" novalidate>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="f-first">First Name *</label><input class="form-control" id="f-first" name="first_name" required></div>
        <div class="col-md-6"><label class="form-label" for="f-last">Last Name *</label><input class="form-control" id="f-last" name="last_name" required></div>
        <div class="col-12"><label class="form-label" for="f-business_type">Solar Business Type *</label><select class="form-select" id="f-business_type" name="business_type" required><option value="" selected disabled>Select an option</option><option>Solar &amp; Mini-grid Developer</option><option>Solar Installer / Dealer</option><option>Solar Distributor</option></select></div>
        <div class="col-12"><label class="form-label" for="f-panels_per_year">On average, how many solar panels do you deploy annually? *</label><select class="form-select" id="f-panels_per_year" name="panels_per_year" required><option value="" selected disabled>Select an option</option><option>1 – 199 Panels</option><option>200 - 499 Panels</option><option>500 – 1,999 Panels</option><option>2000 – 9,999 Panels</option><option>Above 10,000 Panels</option></select></div>
        <div class="col-12"><label class="form-label" for="f-project_capacity">What capacity of solar projects do you mostly handle? *</label><select class="form-select" id="f-project_capacity" name="project_capacity" required><option value="" selected disabled>Select an option</option><option>Below 3kW</option><option>3kW – 20kW</option><option>30kW – 100kW</option><option>200kW – 500kW</option><option>Above 1MW</option></select></div>
        <div class="col-md-6"><label class="form-label" for="f-company">Company Name *</label><input class="form-control" id="f-company" name="company" required></div>
        <div class="col-md-6"><label class="form-label" for="f-role">Job Role *</label><input class="form-control" id="f-role" name="job_role" required></div>
        <div class="col-md-6"><label class="form-label" for="f-email">Email Address *</label><input class="form-control" id="f-email" name="email" type="email" required></div>
        <div class="col-md-6"><label class="form-label" for="f-wa">WhatsApp</label><input class="form-control" id="f-wa" name="whatsapp" type="tel"></div>
        <div class="col-md-6"><label class="form-label" for="f-phone">Phone *</label><input class="form-control" id="f-phone" name="phone" type="tel" required></div>
        <div class="col-md-6"><label class="form-label" for="f-heard">How did you hear about us?</label><input class="form-control" id="f-heard" name="heard_about_us"></div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-green" type="submit">Submit</button>
        <button class="btn btn-outline-secondary rounded-pill" type="button" onclick="history.length > 1 ? history.back() : (location.href='/')">Go back</button>
      </div>
      <p class="small text-muted mt-3 mb-0">*Fill completely before submitting. *By submitting, you agree to our <a href="/policy/">Privacy Policy</a>.</p>
      <div class="form-msg" role="status"></div>
    </form>
  </div>
</section>

</main>
